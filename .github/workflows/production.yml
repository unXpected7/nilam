name: Nilam Production

on:
  pull_request:
    branches: [prod]
  push:
    branches: [prod]

permissions:
  contents: read

jobs:
  verify-frontend:
    runs-on: [self-hosted, linux, x64, nilam]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  verify-backend:
    runs-on: [self-hosted, linux, x64, nilam]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run lint

  deploy-production-database:
    if: github.event_name == 'push'
    needs: [verify-frontend, verify-backend]
    runs-on: [self-hosted, linux, x64, nilam]
    environment: production
    steps:
      - name: Reconcile production PostgreSQL
        run: |
          cd "$HOME/nilam/postgres"
          docker compose up -d postgres-prod
          docker compose ps postgres-prod
      - name: Build and deploy production application
        run: |
          compose_file=deploy/vm01/app/docker-compose.yml
          env_file="$HOME/nilam/postgres/.env"
          docker compose --project-name nilam --env-file "$env_file" -f "$compose_file" build prod-frontend prod-backend
          for container in nilam-prod-frontend nilam-prod-backend; do
            if docker inspect "$container" >/dev/null 2>&1; then
              project="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "$container")"
              if [ "$project" != nilam ]; then
                docker rm --force "$container"
              fi
            fi
          done
          docker compose --project-name nilam --env-file "$env_file" -f "$compose_file" up -d prod-frontend prod-backend
          docker compose --project-name nilam --env-file "$env_file" -f "$compose_file" ps prod-frontend prod-backend
