name: Nilam Production

on:
  pull_request:
    branches: [prod]
  push:
    branches: [prod]

permissions:
  contents: read

jobs:
  verify-frontend:
    runs-on: [self-hosted, linux, x64, nilam]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  verify-backend:
    runs-on: [self-hosted, linux, x64, nilam]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run lint

  deploy-production-database:
    if: github.event_name == 'push'
    needs: [verify-frontend, verify-backend]
    runs-on: [self-hosted, linux, x64, nilam]
    environment: production
    steps:
      - name: Reconcile production PostgreSQL
        run: |
          cd "$HOME/nilam/postgres"
          docker compose up -d postgres-prod
          docker compose ps postgres-prod
      - name: Build and deploy production application
        run: |
          docker compose --env-file "$HOME/nilam/postgres/.env" -f deploy/vm01/app/docker-compose.yml up --build -d prod-frontend prod-backend
          docker compose --env-file "$HOME/nilam/postgres/.env" -f deploy/vm01/app/docker-compose.yml ps prod-frontend prod-backend
