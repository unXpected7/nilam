name: Nilam Production

on:
  pull_request:
    branches: [prod]
  push:
    branches: [prod]

permissions:
  contents: read

jobs:
  verify-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  verify-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run lint

  deploy-production-database:
    if: github.event_name == 'push'
    needs: [verify-frontend, verify-backend]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VM01_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VM01_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Reconcile production PostgreSQL
        env:
          VM01_HOST: ${{ secrets.VM01_HOST }}
          VM01_USER: ${{ secrets.VM01_USER }}
        run: |
          ssh "$VM01_USER@$VM01_HOST" 'cd ~/nilam/postgres && docker compose up -d postgres-prod && docker compose ps postgres-prod'
