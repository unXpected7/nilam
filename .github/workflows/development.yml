name: Nilam Development

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-frontend:
    runs-on: [self-hosted, linux, x64, nilam]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  verify-backend:
    runs-on: [self-hosted, linux, x64, nilam]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run lint

  deploy-development-database:
    if: github.event_name == 'push'
    needs: [verify-frontend, verify-backend]
    runs-on: [self-hosted, linux, x64, nilam]
    environment: development
    steps:
      - name: Reconcile development PostgreSQL
        run: |
          cd "$HOME/nilam/postgres"
          docker compose up -d postgres-dev
          docker compose ps postgres-dev
