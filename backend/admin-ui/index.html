<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nilam Admin</title>
    <link rel="stylesheet" href="/admin.css" />
  </head>
  <body>
    <main id="login-view" class="login-view">
      <a class="login-brand" href="http://localhost:5173/">nilam<span>.</span></a>
      <section class="login-card">
        <p class="eyebrow">ERP control centre</p><h1>Admin access</h1>
        <p>Enter the local admin token from <code>backend/.env</code>. It is stored only for this browser session.</p>
        <form id="login-form"><label>Admin token<input id="token-input" type="password" autocomplete="current-password" required /></label><p id="login-error" class="error" role="alert"></p><button>Open workspace</button></form>
      </section>
    </main>
    <main id="app-view" class="app-view" hidden>
      <aside class="sidebar">
        <a class="brand" href="/dashboard">nilam<span>.</span><small>admin</small></a>
        <nav aria-label="Admin navigation">
          <a data-route="/dashboard" href="/dashboard">Overview</a><a data-route="/products" href="/products">Products</a><a data-route="/categories" href="/categories">Categories</a><a data-route="/collections" href="/collections">Collections</a><a data-route="/inventory" href="/inventory">Inventory</a>
        </nav>
        <p class="sidebar-note">Local environment<br /><span>Token session active</span></p>
      </aside>
      <section class="content">
        <header class="topbar"><div><p id="page-eyebrow" class="eyebrow">ERP control centre</p><h1 id="page-title">Overview</h1></div><button id="sign-out" class="secondary" type="button">Sign out</button></header>
        <div id="toast" class="toast" role="status" aria-live="polite" hidden></div><div id="page-content" aria-live="polite"></div>
      </section>
    </main>
    <dialog id="product-dialog">
      <form id="product-form"><div class="dialog-heading"><div><p class="eyebrow">Catalogue</p><h2 id="product-dialog-title">New product</h2></div><button class="close-dialog" type="button" aria-label="Close">×</button></div><input id="product-id" type="hidden" />
        <div class="form-grid"><label>Name<input id="product-name" required /></label><label>Handle<input id="product-handle" required pattern="[a-z0-9-]+" /></label><label>Category<select id="product-category" required></select></label><label>Status<select id="product-status"><option value="DRAFT">Draft</option><option value="ACTIVE">Active</option><option value="ARCHIVED">Archived</option></select></label><label class="full">Description<textarea id="product-description" required></textarea></label><label class="new-only">SKU<input id="product-sku" /></label><label class="new-only">Price (IDR)<input id="product-price" type="number" min="0" step="1" /></label><label class="new-only">Opening stock<input id="product-quantity" type="number" min="0" step="1" /></label><label class="full new-only">Image URL <small>(optional)</small><input id="product-image" type="url" /></label></div>
        <p id="product-error" class="error" role="alert"></p><div class="dialog-actions"><button class="secondary close-dialog" type="button">Cancel</button><button id="product-save">Save product</button></div>
      </form>
    </dialog>
    <script src="/admin.js" defer></script>
  </body>
</html>
