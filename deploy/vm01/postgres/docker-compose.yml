services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: nilam-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DEV_POSTGRES_DB}
      POSTGRES_USER: ${DEV_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD}
    ports:
      - "192.168.100.35:5436:5432"
    volumes:
      - nilam_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEV_POSTGRES_USER} -d ${DEV_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres-prod:
    image: postgres:16-alpine
    container_name: nilam-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PROD_POSTGRES_DB}
      POSTGRES_USER: ${PROD_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PROD_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - nilam_postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROD_POSTGRES_USER} -d ${PROD_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  nilam_postgres_dev_data:
  nilam_postgres_prod_data:
